openapi: 3.0.2
info:
  title: Develop Health Prior Authorization API
  description: API services for managing prior authorization in the healthcare domain.
  version: 1.0.0
servers:
  - url: "https://api.develophealth.ai"
security:
  - BearerAuth: []

paths:
  /eligibility-check:
    post:
      summary: Check patient eligibility for coverage
      operationId: checkEligibility
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityRequest"
      responses:
        "200":
          description: Eligibility information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityResponse"
        "400":
          description: Invalid request data
        "401":
          $ref: '#/components/responses/UnauthorizedError'

  /support-program:
    get:
      summary: Retrieve support program based on given NDC
      operationId: getSupportProgramByNDC
      parameters:
        - name: ndc
          in: query
          required: true
          schema:
            type: string
          description: National Drug Code to identify the support program
      responses:
        "200":
          description: Support program details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportProgramDetails"
        "404":
          description: Support program not found
        "401":
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
  schemas:
    EligibilityRequest:
      type: object
      properties:
        patientId:
          type: string
          example: "patient_123456"
        insuranceDetails:
          type: object
          properties:
            policyNumber:
              type: string
            groupNumber:
              type: string

    EligibilityResponse:
      type: object
      properties:
        coverageStatus:
          type: string
          enum: [covered, not_covered, partial]
        coverageDetails:
          type: object
          additionalProperties: true

    MedicationDetails:
      type: object
      properties:
        drugName:
          type: string
        drugCode:
          type: string
        dosage:
          type: string
        quantity:
          type: integer

    SupportProgramDetails:
      type: object
      properties:
        programId:
          type: string
          description: Unique identifier for the support program
        programName:
          type: string
          description: Name of the support program
        providedBy:
          type: string
          enum: [hub_service, drug_manufacturer]
          description: Entity providing the support program
        description:
          type: string
          description: Brief overview of the support program
