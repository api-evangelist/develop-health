  /status:
    get:
      tags:
      - public-api
      summary: Get Status Route
      description: "Handles GET requests at the '/status' endpoint.\n\nThis route function is designed to provide a quick status check of the API.\nWhen called, it returns a JSON response indicating the operational status of the API.\n\nReturns:\n    ApiResponse: An object of ApiResponse schema which includes a 'status' key set to 'success'\n                 and a 'data' key containing a message about the API's operational status."
      operationId: get_status_route_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - FronteggJWTAuthentication: []
  /provider/authorize:
    post:
      tags:
      - public-api
      summary: Authorize Provider
      operationId: authorize_provider_provider_authorize_post
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/AuthorizeProviderRequest'
              title: Data
        required: true
      responses:
        '200':
          description: Successful initiation of provider authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
        '400':
          description: Provider authorization already initiated
          content:
            application/json:
              example:
                status: error
                error:
                  title: Provider Authorization Already Initiated
                  description: Authorization has already been initiated for a provider with this NPI or email
                  code: PROVIDER_AUTHORIZATION_ALREADY_INITIATED
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - FronteggJWTAuthentication: []
  /authorized-providers:
    get:
      tags:
      - public-api
      summary: Get Authorized Providers
      description: "Retrieve all authorized providers for the organization.\n\nReturns a list of providers that have been authorized or are pending authorization.\nProviders with signed_at=null are pending authorization (they haven't signed the form yet).\nProviders with signed_at populated have completed the authorization process.\n\nReturns:\n    ApiResponse containing a list of AuthorizedProviderResponse objects"
      operationId: get_authorized_providers_authorized_providers_get
      responses:
        '200':
          description: Successfully retrieved authorized providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_api.schemas.platform.public_api.provider.AuthorizedProviderResponse__'
              example:
                status: success
                data:
                - npi: '1234567890'
                  first_name: John
                  last_name: Doe
                  email: john.doe@example.com
                  signed_at: '2024-01-15T10:30:00Z'
                - npi: 0987654321
                  first_name: Jane
                  last_name: Smith
                  email: jane.smith@example.com
      security:
      - FronteggJWTAuthentication: []
  /provider/lookup:
    post:
      tags:
      - public-api
      summary: Lookup Provider
      description: 'Look up a provider by NPI or by name+state.


        NPI mode: returns ``active``, ``deactivated`` (with name+state search

        candidates seeded from the deactivated record''s name), ``not_found``, or

        ``registry_error``. Sandbox organizations may receive an ``active``

        mock identity when the NPI is absent from the registry. Deactivated

        records with no name on file return an empty candidate list — the FE

        prompts for manual name+state entry.


        Name mode: ``last_name`` is required, ``first_name`` and ``state`` are

        optional. Always returns ``search_results`` (the candidate list may be

        empty when no match is found).'
      operationId: lookup_provider_provider_lookup_post
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ProviderLookupRequest'
              title: Body
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_ProviderLookupResponse_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - FronteggJWTAuthentication: []
