          description: 'A code indicating the reason for the prior auth outcome. The possible values are:

            - **coverage_inactive**: The patient''s coverage has expired.

            - **coverage_not_yet_started**: The patient''s coverage has not yet started.

            - **no_pharmacy_benefits**: The patient''s insurance does not include pharmacy benefits.

            - **payer_unable_to_locate_member**: The payer could not locate the member in their system.

            - **npi_taxonomy_ineligible**: The payer rejected the request because the prescriber''s NPI taxonomy, provider type, specialty, or credentials are not eligible to submit this prior authorization.

            - **payer_reported_invalid_patient_info**: The payer located the patient in their system but some submitted patient information does not match.

            - **duplicate_request**: The request is a duplicate. Please cancel the existing request and resubmit if needed.

            - **prior_auth_not_required**: A prior authorization is not required for this medication.

            - **patient_consent_required**: The payer requires verbal consent from the patient before discussing or processing the prior authorization.

            - **more_information_required**: Insufficient information provided to complete the prior authorization.

            - **other**: A problem not listed here was encountered. Check the `outcome.detail` field for more information.'
