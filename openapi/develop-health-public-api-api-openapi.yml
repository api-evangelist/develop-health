          - $ref: '#/components/schemas/PrescriptionTransferStatus'
          description: Status of the pharmacy transfer
        confirmed:
          type: boolean
          title: Confirmed
          description: True if completed and confirmation succeeded
          default: false
        error_code:
          allOf:
          - $ref: '#/components/schemas/PrescriptionTransferErrorCode'
          description: 'Error code if transfer failed.


            Note: this list of codes may grow over time, so your implementation should handle unrecognized values (probably in the same way as ''other'').

            - **pharmacy_does_not_exist**: The specified pharmacy does not exist in our records.

            - **pharmacy_permanently_closed**: The pharmacy has been permanently closed and cannot accept any transfers.

            - **pharmacy_unable_to_accept_transfer**: The pharmacy is unable to accept the prescription transfer.

            - **pharmacy_unable_to_fill_prescription**: The pharmacy cannot fill the prescription due to restrictions or lack of stock.

            - **prescription_transfer_not_received**: The pharmacy did not receive the prescription transfer, possibly after several attempts.

            - **transfer_timed_out**: The prescription transfer timed out before it could be completed.

            - **other**: An unexpected error occurred during the prescription transfer process.'
