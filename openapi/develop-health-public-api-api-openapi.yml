          description: "A specific code identifying the error. While we'll aim to ensure that the occurence of these errors is minimal, it's likely they will occur. To prevent delays to patient care, we generally recommend that you implement a strategy of falling back to your existing process for handling a prior authorization if you encounter one of these errors. The Develop Health team will then work with you in parallel to fix the issue. The following codes are currently possible: \n- **unsupported_patient**: This means that the patient you submitted the prior authorization for is not currently supported. We're rapidly increasing our PBM and payer coverage, so we'll be reducing the occurrence of these over time.\n- **unsupported_drug**: The drug you submitted is not yet supported for prior authorization.\n- **insurance_card_member_id_ocr_failure**: We were unable to extract the member ID from the insurance card image provided and no discrete values were provided.\n- **insurance_content_invalid_rx_bin**: The Rx BIN provided in the insurance content is invalid. This should be a 6 digit number.\n- **prescription_message_not_found**: The prescription_message_id provided does not correspond to any known prescription.\n- **prescription_message_already_linked**: The prescription_message_id provided is already linked to a prior authorization request that is in progress or has already been completed as approved. The existing PA request must be cancelled before submitting a new request for the same prescription.\n- **provider_not_authorized**: The NPI provided is not authorized to submit requests. To enable prior authorization requests for this provider, please complete the provider authorization process.\n- **evidence_file_download_failed**: The evidence file could not be downloaded from the provided URL.\n- **invalid_qle_resubmission**: Quantity limit exception resubmissions are only allowed when the previous prior authorization was approved or was not required.\n- **previous_pa_request_in_progress**: The previous prior authorization request referenced in resubmission_info is still in progress. It must be completed or cancelled before a new resubmission can be created.\n- **other**: An unexpected error occurred during the prior authorization process."
          choices:
          - - unsupported_patient
            - unsupported_patient
          - - unsupported_drug
            - unsupported_drug
          - - insurance_card_member_id_ocr_failure
            - insurance_card_member_id_ocr_failure
          - - insurance_content_invalid_rx_bin
            - insurance_content_invalid_rx_bin
          - - prescription_message_not_found
            - prescription_message_not_found
          - - prescription_message_already_linked
            - prescription_message_already_linked
          - - provider_not_authorized
            - provider_not_authorized
          - - evidence_file_download_failed
            - evidence_file_download_failed
          - - invalid_qle_resubmission
            - invalid_qle_resubmission
          - - previous_pa_request_in_progress
            - previous_pa_request_in_progress
          - - other
            - other
        existing_prior_auth_request_id:
          type: string
          title: Existing Prior Auth Request Id
          description: Identifier of an existing prior authorization request related to this error.
      type: object
      required:
      - title
      - code
      title: CreatePriorAuthResponseError
