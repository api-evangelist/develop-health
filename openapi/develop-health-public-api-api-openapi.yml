    PriorAuthMockResultNotSubmitted:
      properties:
        result:
          type: string
          enum:
          - Not Submitted
          const: Not Submitted
          title: Result
          description: The prior authorization request will not be submitted. For example, when the eligibility check is enabled and the check returns as error.
          default: Not Submitted
        detail_code:
          allOf:
          - $ref: '#/components/schemas/PriorAuthOutcomeNotSubmittedDetail'
          description: 'A code indicating the reason for the prior auth outcome. The possible values are:

            - **eligibility_check_error**: Indicates eligibility check encountered an error. Error details will be surfaced in the `eligibility_check_response` field. This status will not happen if `ndp_submission.ignore_eligibility_check_error` was set to True for the PA request.

            - **eligibility_check_government_plan**: Indicates that the eligibility check revealed the patient has only government insurance plan(s). The `eligibility_check_response` field will contain the successful eligibility check response. This status will not happen if `ndp_submission.submit_pa_with_eligibility_check_government_plan` was set to True for the PA request.

            - **prescription_message_not_found**: Indicates the provided prescription message ID does not correspond to a prescription. This can happen if the eScript received to the NDP could not be converted into a valid prescription.

            - **more_information_required**: Indicates that additional information is required before this request can be submitted. The request was not submitted and should be resubmitted with the additional details.

            - **formulary_alternative_required**: Indicates that the patient needs to try a formulary alternative before the PA can be approved. The request was not submitted and should instead be submitted for the formulary alternative outlined in the outcome message.

            - **benefit_verification_no_medication_coverage**: Indicates that a triggered benefit verification determined the prescribed medication is not covered by the patient''s plan.

            - **benefit_verification_only_alternative_medication_covered**: Indicates that a triggered benefit verification determined the prescribed medication is not covered, but an alternative medication specified in the request is covered.

            - **benefit_verification_pa_not_required**: Indicates that a triggered benefit verification determined the prescribed medication is covered and does not require prior authorization.

            - **pbm_excluded**: Indicates that the eligibility check revealed only an excluded PBM payer and the PA was not submitted. The `eligibility_check_response` field will contain the successful eligibility check response.

            - **payer_not_supported**: Indicates that the eligibility check revealed the patient''s health plan is not supported. Currently, Kaiser health plans are not supported. The `eligibility_check_response` field will contain the successful eligibility check response.'
      type: object
      title: PriorAuthMockResultNotSubmitted
      description: 'Represents a mock result where the prior authorization was NOT submitted

        because the eligibility check either encountered an error or revealed the

        patient has a government plan.'
