    EligibilityCheckResponseErrorItem:
      properties:
        status:
          type: string
          enum:
          - error
          title: Status
          default: error
        error_code:
          allOf:
          - $ref: '#/components/schemas/EligibilityCheckErrorCode'
          description: 'The error code indicating the specific error encountered. Possible values are:

            - **provider_not_on_file**: The payer has no record of the provider ID supplied. Provider is not registered with the payer, provider must call payer directly to register their NPI.

            - **patient_birth_date_does_not_match_database**: The DOB supplied doesn’t match the payer’s record for the member ID.

            - **invalid_missing_subscriber_insured_id**: Member ID is empty, wrong length, or fails checksum/cross-file lookup. Or does not meet the payer requirements for subscriber ID. This error is rarely encountered.

            - **subscriber_insured_not_found**: Member could not be located with the ID / name / DOB combination submitted. This error is the most common by far.

            - **duplicate_subscriber_insured_id_number**: The ID supplied matches more than one person in the payer’s system; inquiry is ambiguous. This error is very rarely encountered, usually only around New Year.'
        error_message:
          type: string
          maxLength: 256
          title: Error Message
          description: Human-readable description of the error. This always corresponds to the error code.
        action_code:
          allOf:
          - $ref: '#/components/schemas/EligibilityCheckActionCode'
          description: 'The action suggested by the payer in response to the error. Possible values are:

            - **please_correct_and_resubmit**: The transaction failed basic edits (e.g., missing or invalid data). Fix the errors and resubmit. This indicates the data submitted is incorrect.

            - **resubmission_not_allowed**: The payer will not accept this inquiry again in its current form; requires taking action outside of PMS / contacting the payer directly. For example, (49) PCP assignment requires updating, (76) duplicate patient records must be merged.'
      type: object
      required:
      - error_code
      - error_message
      - action_code
      title: EligibilityCheckResponseErrorItem
