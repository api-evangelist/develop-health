    CodedPrescription:
      properties:
        ndc:
          type: string
          pattern: ^(\d{5}-?\d{4}-?\d{2}|\d{4,5}-\d{3,4}-\d{1,2}|\d{5}-?\d{4}|\d{4,5}-\d{3,4})$
          title: Ndc
          description: The NDC of the medication. Both 10 and 11-digit NDCs are supported.
          examples:
          - 00169-4505-14
          - 0169-4505-14
          - 00169450514
        directions:
          type: string
          minLength: 1
          title: Directions
          description: Instructions on how the medication should be taken.
          examples:
          - Inject 0.25 mg under the skin once weekly
          - Take 1 tablet by mouth daily
        quantity:
          type: integer
          title: Quantity
          description: The quantity of the medication.
          examples:
          - 1
        quantity_unit_of_measure:
          type: string
          title: Quantity Unit Of Measure
          description: The unit of measurement for the quantity of the medication (subset code C89510). Either an NCIt code or the name of the term. If not provided, C38046 (Unspecified) will be used.
          default: C38046
          examples:
          - C48504
          - Kit
        days_supply:
          type: integer
          title: Days Supply
          description: The number of days the prescription will be expected to last.
          examples:
          - 28
          - 30
          - 90
        expected_length_of_therapy:
          type: string
          title: Expected Length Of Therapy
          description: The expected length of therapy for the prescribed drug. Defaults to 'Until No Longer Needed' if not provided.
          examples:
          - Until No Longer Needed
          - 12 months
          - 6 weeks
        extra:
          type: object
          title: Extra
          description: An optional dictionary containing additional information related to the drug or future prescription.
          examples:
          - notes: Patient prefers brand name
            prior_auth_reference: ABC123
        prescription_date:
          type: string
          format: date-time
          title: Prescription Date
          description: The date the prescription was issued
      type: object
      required:
      - ndc
      - directions
      - quantity
      - days_supply
      - prescription_date
      title: CodedPrescription
      description: 'Represents a prescription issued by a healthcare provider. This is an

        alternative to the Prescription model that is more closely aligned with

        NCPDP standards and helps reduce any confusion on the payer-side. Prefer

        this model over Prescription when NDCs are available.'
