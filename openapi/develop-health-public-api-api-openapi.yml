    FailureDetails:
      properties:
        title:
          type: string
          title: Title
          description: A brief title summarizing the error.
        code:
          allOf:
          - $ref: '#/components/schemas/ClientErrorCode'
          description: "A specific code identifying the error. This list will likely expand over time to provide more specific error codes. The following codes are currently supported: \n- **Unable to Route Call**: We were unable to determine the correct number to call using the insurance information provided. More information is required.\n- **Document Info Missing or Incorrect**: The insurance documents provided are missing information that is necessary to identify the patient. The information could be outdated or not present in the documentation. For example, the documents might be missing the member ID for the patient, or could have a medical only ID, or could have an out of date address. To fix this error you can try re-uploading documents that contain the information specified in the message for this error.\n- **Document Quality Error**: The insurance documents provided are not valid insurance documents or are low quality (blurry or low resolution) and therefore cannot be processed by our system. To fix this error you can try re-uploading higher quality documents.\n- **Insurance Card OCR Failure**: This error means we were unable to read the necessary information from the insurance card image provided. This could be due to the image being unclear. Please check the images provided and/or provide the information manually if possible. This is generally an issue that would be handled on your side, and may involve reaching out to the patient to get a better image of their insurance card.\n- **Insurance Unable to Provide Information**: The insurance company was unable to provide the information needed to determine the patient's coverage status. This could be due to various reasons such as the insurance representative being unable or unwilling to provide the necessary details, or issues during the call, like refusal to transfer to a supervisor.\n- **Patient Not Found**: The plan contact we called was unable to locate the patient in their system. We weren't able to identify a root cause issue with the documentation provided, but re-uploading additional documents may help.\n- **Unable to Gather Benefits**: We were unable to gather benefits from the insurance company. This could be due to a variety of reasons, such as the insurance company not being able to provide the information, or the information provided not being sufficient to determine the patient's coverage status. To fix this error, you can try providing insurace information manually and/or providing medication history.\n- **Internal Error**: There was an internal error during the benefit verification.\n- **Provider Not Authorized**: The NPI provided is not authorized to submit requests. To enable benefit verification requests for this provider, please complete the provider authorization process.\n- **Patient Consent Required**: Benefit verification could not be completed. The payer requires the patient to provide verbal consent during the call."
        detail_code:
          anyOf:
          - $ref: '#/components/schemas/ClientInsuranceDocumentErrorDetailCode'
          - $ref: '#/components/schemas/ClientOtherErrorDetailCode'
          title: Detail Code
          description: A more detailed code that can be used to identify the specific issue that caused the error.
        message:
          type: string
          title: Message
          description: 'A detailed message explaining the error, such as: ''We were unable to extract the member ID from the insurance card image provided, the image(s) my be unclear.'' These messages may be unique to the specific benefit verification request.'
        detail_message:
          type: string
          title: Detail Message
          description: A more detailed message that can be used to identify the specific issue that caused the error.
      type: object
      required:
      - title
      title: FailureDetails
      description: Represents status details about a failed benefit verification.
