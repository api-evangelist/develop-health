          title: Provider
          description: Details of the healthcare provider whose NPI number can be used for the benefit verification.
        entity:
          allOf:
          - $ref: '#/components/schemas/EntityInfo'
          title: Entity
          description: A large proportion (20%+) of payers will often ask for information on the legal entity that the provider is associated with. Without this information the benefit verification will fail. Although this is currently optional it will be required in the future. We highly recommend providing this information.
        insurance:
          items:
            $ref: '#/components/schemas/InsuranceDocumentInfo'
          type: array
          title: Insurance
          description: Insurance information for the patient.
        pharmacy_benefit_manager_name:
          type: string
          title: Pharmacy Benefit Manager Name
          description: The name of the pharmacy benefit manager (PBM) responsible for the patient's coverage. E.g. 'OptumRx' or 'Express Scripts'. May be null if the PBM's name is not available.
        patient_coverage_status:
          allOf:
          - $ref: '#/components/schemas/PatientCoverageStatus'
          description: 'This field indicates the insurance coverage status of the patient. The options are:

            - **covered**: Indicates that the patient is covered by the insurance plan.

            - **patient_not_found**: Indicates that the patient could not be found in the insurance database.

            - **coverage_expired**: Implies that the patient''s insurance coverage has expired.

            - **coverage_not_started**: Suggests that the patient''s insurance coverage is in place but has not started yet.

            - **patient_not_covered_unspecified**: Used when the patient is not covered by the insurance plan, but the specific reason is not specified.

            - **unknown**: We were unable to determine the patient''s insurance coverage status.'
        verification_methods:
          items:
            $ref: '#/components/schemas/BenefitVerificationMethodInfo'
          type: array
