          description: 'A code indicating the reason for the prior auth outcome. The possible values are:

            - **formulary_alternative_preferred**: The formulary alternative is preferred.

            - **medical_necessity_criteria_not_met**: The medical necessity criteria are not met.

            - **plan_exclusion**: The drug is excluded by the plan.

            - **step_therapy_criteria_not_met**: The step therapy criteria are not met.

            - **existing_denial**: An existing denial is on file for this medication and patient. Please follow the appeals process if you wish to adjust this outcome

            - **coverage_limits_exceeded**: The coverage limits have been exceeded for this patient''s plan.

            - **prior_weight_loss_program_required**: The patient has not completed the required weight loss program prior to therapy.

            - **unknown**: The prior authorization request has been denied.'
