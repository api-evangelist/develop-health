          - $ref: '#/components/schemas/BenefitVerificationStatus'
          description: Benefit Verifications will always start in the pending state. Once the verification is complete, the status will change to completed or failed. If the verification is still in progress, the status will remain pending.
        status_description:
          type: string
          title: Status Description
