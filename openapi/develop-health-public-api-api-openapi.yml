    CodedDrugInfo:
      properties:
        ndc:
          type: string
          pattern: ^(\d{5}-?\d{4}-?\d{2}|\d{4,5}-\d{3,4}-\d{1,2}|\d{5}-?\d{4}|\d{4,5}-\d{3,4})$
          title: Ndc
